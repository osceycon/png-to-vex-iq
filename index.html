<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PNG to VEX IQ</title>
    <style>
        html {
            background-color: #0f0f0f;
            color: #f0f0f0;
            font-family: "Arial"
        }
        button {
            background-color: #4f4f4f;
            color: #f0f0f0;
            font-family: "Arial"
        }
        textarea {
            background-color: #4f4f4f;
            color: #f0f0f0;
            font-family: "Arial";
        }
    </style>
</head>
<body>
    <h1>PNG to VEX IQ pixel code</h1>
    <p><strong>select a file:</strong></p>
    <input type="file" id="inputimage" accept="image/*">
    <p><strong>output:</strong></p>
    <p id="status"></p>
    <button id="copy" disabled>Copy</button>
    <button id="download" disabled>Download out.iqpython</button>
    <br><br>
    <textarea id="output" rows="25" cols="100" readonly></textarea>
    <footer>
        <p>written by oscey</p>
        <p>November 18th, 2026</p>
    </footer>

<script>
const MAX_W = 160;
const MAX_H = 108;
const NUM_COLORS = 16; // max 16 (one hex digit per pixel)

// ---------- Median cut quantization ----------

function medianCut(pixels, k) {
  const buckets = [pixels];

  while (buckets.length < k) {
    let best = -1, bestRange = -1, bestCh = 0;
    buckets.forEach((bucket, i) => {
      if (bucket.length < 2) return;
      for (let ch = 0; ch < 3; ch++) {
        let min = 255, max = 0;
        for (const p of bucket) {
          if (p[ch] < min) min = p[ch];
          if (p[ch] > max) max = p[ch];
        }
        if (max - min > bestRange) {
          bestRange = max - min;
          best = i;
          bestCh = ch;
        }
      }
    });
    if (best < 0 || bestRange <= 0) break;

    const bucket = buckets[best];
    bucket.sort((p, q) => p[bestCh] - q[bestCh]);
    const mid = bucket.length >> 1;
    buckets.splice(best, 1, bucket.slice(0, mid), bucket.slice(mid));
  }

  return buckets
    .filter((b) => b.length > 0)
    .map((b) => {
      const sum = [0, 0, 0];
      for (const p of b) {
        sum[0] += p[0];
        sum[1] += p[1];
        sum[2] += p[2];
      }
      return sum.map((v) => Math.round(v / b.length));
    });
}

function quantize(pixels, colors) {
  const palette = medianCut(pixels.slice(), colors);
  const indices = new Array(pixels.length);
  for (let p = 0; p < pixels.length; p++) {
    const [r, g, b] = pixels[p];
    let bestIdx = 0, bestDist = Infinity;
    for (let i = 0; i < palette.length; i++) {
      const [pr, pg, pb] = palette[i];
      const dist = (r - pr) ** 2 + (g - pg) ** 2 + (b - pb) ** 2;
      if (dist < bestDist) {
        bestDist = dist;
        bestIdx = i;
      }
    }
    indices[p] = bestIdx;
  }
  return { palette, indices };
}

// ---------- Generate the VEXcode Python ----------

function generate(img) {
  // Let the browser decode + resize the image
  const scale = Math.min(1, MAX_W / img.naturalWidth, MAX_H / img.naturalHeight);
  const w = Math.max(1, Math.round(img.naturalWidth * scale));
  const h = Math.max(1, Math.round(img.naturalHeight * scale));

  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff"; // transparent areas become white
  ctx.fillRect(0, 0, w, h);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, 0, 0, w, h);

  const rgba = ctx.getImageData(0, 0, w, h).data;
  const pixels = new Array(w * h);
  for (let p = 0; p < w * h; p++) {
    pixels[p] = [rgba[p * 4], rgba[p * 4 + 1], rgba[p * 4 + 2]];
  }

  const { palette, indices } = quantize(pixels, NUM_COLORS);

  const lines = [];
  lines.push("PAL = [" + palette.map(([r, g, b]) => `(${r}, ${g}, ${b})`).join(", ") + "]");
  lines.push("ROWS = [");
  for (let y = 0; y < h; y++) {
    let row = "";
    for (let x = 0; x < w; x++) {
      row += indices[y * w + x].toString(16);
    }
    lines.push(`    "${row}",`);
  }
  lines.push("]");
  lines.push("");
  lines.push("colors = [Color(r, g, b) for r, g, b in PAL]");
  lines.push("for y, row in enumerate(ROWS):");
  lines.push("    for x, ch in enumerate(row):");
  lines.push("        brain.screen.set_pen_color(colors[int(ch, 16)])");
  lines.push("        brain.screen.draw_pixel(x, y)");

  return { code: lines.join("\n") + "\n", w, h, colorCount: palette.length };
}

// ---------- UI wiring ----------

const input = document.getElementById("inputimage");
const output = document.getElementById("output");
const status = document.getElementById("status");
const copyBtn = document.getElementById("copy");
const downloadBtn = document.getElementById("download");

input.addEventListener("change", () => {
  const file = input.files[0];
  if (!file) return;

  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const result = generate(img);
    output.value = result.code;
    status.textContent = `Done: ${result.w}x${result.h}, ${result.colorCount} colors, ${result.code.length} characters`;
    copyBtn.disabled = false;
    downloadBtn.disabled = false;
    URL.revokeObjectURL(url);
  };
  img.onerror = () => {
    status.textContent = "Could not read that image.";
    URL.revokeObjectURL(url);
  };
  img.src = url;
});

copyBtn.addEventListener("click", () => {
  output.select();
  navigator.clipboard.writeText(output.value);
});

downloadBtn.addEventListener("click", () => {
  const blob = new Blob([output.value], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "out.iqpython";
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>
</body>
</html>
